<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程調整 | morich</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#C8102E;--red-dark:#9E0B24;--red-light:#fdf0f2;--gray:#e0e0e0;--text:#1a1a1a;--sub:#666}
body{font-family:"Noto Sans JP",sans-serif;background:#fff;color:var(--text)}
header{background:var(--red);padding:20px 24px;display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--red)}
header h1{color:#fff;font-size:15px;font-weight:500}
main{max-width:560px;margin:0 auto;padding:40px 24px 60px}
.intro{font-size:14px;line-height:1.8;color:var(--sub);margin-bottom:32px}
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sub);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--gray)}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.input-group input{width:100%;padding:10px 12px;border:1.5px solid var(--gray);border-radius:8px;font-size:14px;font-family:"Noto Sans JP",sans-serif}
.input-group input:focus{outline:none;border-color:var(--red)}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:36px}
.btn{display:block;width:100%;text-align:left;padding:18px 20px;border:1.5px solid var(--gray);border-radius:10px;background:#fff;cursor:pointer;font-family:"Noto Sans JP",sans-serif;position:relative;transition:all .18s}
.btn:hover{border-color:var(--red);background:var(--red-light);transform:translateX(3px)}
.btn.selected{border-color:var(--red);background:var(--red-light);box-shadow:0 0 0 2px var(--red)}
.date-main{font-size:17px;font-weight:700;margin-bottom:2px}
.date-sub{font-size:13px;color:var(--sub)}
.check{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--gray);display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn.selected .check{background:var(--red);border-color:var(--red);color:#fff}
.submit{display:block;width:100%;padding:17px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:"Noto Sans JP",sans-serif;cursor:pointer;transition:background .18s;margin-top:8px}
.submit:hover{background:var(--red-dark)}
.submit:disabled{background:var(--gray);color:#999;cursor:not-allowed}
.thanks{display:none;text-align:center;padding:48px 0}
.thanks .icon{font-size:48px;margin-bottom:16px}
.thanks h2{font-size:20px;font-weight:700;margin-bottom:12px}
.thanks p{font-size:14px;color:var(--sub);line-height:1.8}
footer{text-align:center;padding:24px;font-size:12px;color:var(--sub);border-top:1px solid var(--gray)}
.error{color:var(--red);font-size:12px;margin-top:4px;display:none}
</style></head><body>
<header><div class="logo">m</div><h1>morich｜日程調整</h1></header>
<main><div id="form">
<p class="intro">お世話になっております。morichの古山でございます。<br>以下のフォームにご入力のうえ、ご都合のよい日時を1つお選びください。</p>
<div class="section-label">お客様情報</div>
<div class="input-group"><label>お名前 <span style="color:var(--red)">*</span></label><input type="text" id="clientName" placeholder="例：山田太郎"></div>
<div class="input-group"><label>メールアドレス <span style="color:var(--red)">*</span></label><input type="email" id="clientEmail" placeholder="例：yamada@example.com"></div>
<div class="input-group"><label>電話番号 <span style="color:var(--red)">*</span></label><input type="tel" id="clientTel" placeholder="例：090-1234-5678"></div>
<div class="section-label" style="margin-top:28px">候補日程</div>
<div class="list" id="list"></div>
<button class="submit" id="submit" disabled onclick="doSubmit()">この日程で確定する</button>
</div>
<div class="thanks" id="thanks">
<div class="icon">✓</div>
<h2>ご選択ありがとうございます</h2>
<p>確認のご連絡を差し上げます。<br>どうぞよろしくお願いいたします。</p>
</div></main>
<footer>株式会社morich｜assistant@morich.jp</footer>
<script>
var C=[{"label":"6月3日（水）17:00〜18:00","startDateTime":"2026-06-03T08:00:00.000Z","endDateTime":"2026-06-03T09:00:00.000Z","row":34},{"label":"6月3日（水）16:00〜17:00","startDateTime":"2026-06-03T07:00:00.000Z","endDateTime":"2026-06-03T08:00:00.000Z","row":33},{"label":"6月3日（水）15:00〜16:00","startDateTime":"2026-06-03T06:00:00.000Z","endDateTime":"2026-06-03T07:00:00.000Z","row":32},{"label":"6月3日（水）10:00〜11:00","startDateTime":"2026-06-03T01:00:00.000Z","endDateTime":"2026-06-03T02:00:00.000Z","row":31},{"label":"6月3日（水）9:00〜10:00","startDateTime":"2026-06-03T00:00:00.000Z","endDateTime":"2026-06-03T01:00:00.000Z","row":30}];
var WU="https://script.google.com/macros/s/AKfycbw_Si2GBlerK3jHLBD2cC8lr1fuM68SRcEnc4jMfAQt57fEKCwK5_28xCPcctJVXnQ/exec";
var sel=null;
var WD=["日","月","火","水","木","金","土"];
C.forEach(function(c,i){
  var d=new Date(c.startDateTime),e=new Date(c.endDateTime);
  var b=document.createElement("button");
  b.className="btn";
  b.innerHTML="<div class='date-main'>"+(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）</div>"
    +"<div class='date-sub'>"+d.getHours()+":"+("0"+d.getMinutes()).slice(-2)+" 〜 "+e.getHours()+":"+("0"+e.getMinutes()).slice(-2)+"</div>"
    +"<span class='check'>✓</span>";
  b.onclick=function(){
    document.querySelectorAll(".btn").forEach(function(x){x.classList.remove("selected");});
    b.classList.add("selected");sel=i;
    checkReady();
  };
  document.getElementById("list").appendChild(b);
});
function checkReady(){
  var n=document.getElementById("clientName").value.trim();
  var e=document.getElementById("clientEmail").value.trim();
  var t=document.getElementById("clientTel").value.trim();
  document.getElementById("submit").disabled=!(n&&e&&t&&sel!==null);
}
document.getElementById("clientName").oninput=checkReady;
document.getElementById("clientEmail").oninput=checkReady;
document.getElementById("clientTel").oninput=checkReady;
function doSubmit(){
  var n=document.getElementById("clientName").value.trim();
  var e=document.getElementById("clientEmail").value.trim();
  var t=document.getElementById("clientTel").value.trim();
  if(!n||!e||!t||sel===null)return;
  var s=C[sel];
  var btn=document.getElementById("submit");
  btn.disabled=true;btn.textContent="送信中...";
  fetch(WU,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({selectedCandidate:s,clientName:n,clientEmail:e,clientTel:t,meetingType:"MyZOOM"}),
    mode:"no-cors"}).catch(function(){});
  document.getElementById("form").style.display="none";
  document.getElementById("thanks").style.display="block";
}
</script>
</body></html>
